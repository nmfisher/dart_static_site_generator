name: blog_builder
description: A static site generator for markdown blogs
version: 1.0.0
publish_to: none # Prevent accidental publishing

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2 
  path: ^1.9.0 
  yaml: ^3.1.2
  markdown: ^7.1.1 
  xml: ^6.3.0    
  intl: ^0.20.2
  image: ^4.3.0
  bluesky: ^0.14.0 
  yaml_edit: ^2.2.0 
  http: ^1.1.0
  html: ^0.15.6
  crypto: ^3.0.6
  highlight: ^0.7.0
  mime: ^1.0.6
  liquify: ^1.6.1
  file: ^7.0.0

# Vendored liquify with variable/expression keys in bracket access
# (Shopify Liquid allows `hash[expr]`; 1.6.1 only parses literal keys).
# Pending upstream PR; remove once a release includes it.
# See vendor/liquify-patched/README.upstream.md and
# vendor/liquify-patched/variable-key-bracket-access.patch
dependency_overrides:
  liquify:
    path: vendor/liquify-patched

dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.0

executables:
  blog_builder: blog_builder
