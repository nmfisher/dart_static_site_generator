name: blog_builder
description: A static site generator for markdown blogs
version: 1.0.0
publish_to: none # Prevent accidental publishing

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2 
  path: ^1.9.0 
  yaml: ^3.1.2
  markdown: ^7.1.1 
  xml: ^6.3.0    
  intl: ^0.20.2
  image: ^4.3.0
  bluesky: ^0.14.0 
  yaml_edit: ^2.2.0 
  http: ^1.1.0 
  liquify: ^1.3.1

dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.0
  file: ^7.0.0 

executables:
  blog_builder: blog_builder
