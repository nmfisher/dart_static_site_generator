title: My Awesome Blog
owner: Jane Doe
baseUrl: https://example.com # Needed for sitemap generation if used

navbar:
  classes: "navbar navbar-expand-lg navbar-light bg-light"
  item-classes: "nav-item"
  logo:
    url: /assets/logo.png
    height: 30
  items:
    - text: Home
      route: /
      classes: "nav-link active"
    - text: About
      route: /about
      classes: "nav-link"
    - text: Posts
      route: /posts # Link to the posts index page (implicitly generated if needed)
      classes: "nav-link"

meta:
  description: "A custom blog generated by Blog Builder"
  keywords: "blog, static site, dart"

# Fallback Meta Tags
# If true, when og:description or og:image are not specified in a post's frontmatter,
# they will be automatically extracted from the first paragraph/image in the post content
fallback_meta_tags: true

# Per-locale builds (ticket 001)
# The default locale is served from the site root; every other locale gets
# its own rooted site under /<locale>/... Translations live in
# content/<locale>/<same-path>, e.g. content/de/posts/hello.md translates
# content/posts/hello.md. Pages are cross-linked with hreflang alternates.
# default_locale: en
# locales:
#   en: { name: English }
#   de: { name: Deutsch }

# Image Optimization Settings
image_optimization:
  enabled: true
  png:
    enabled: true
    compression_level: 9
    strip_metadata: true
  jpeg:
    enabled: true
    quality: 85
  webp:
    enabled: true
    quality: 80
    method: 4
    create_fallbacks: true
